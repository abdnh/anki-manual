[book]
authors = ["شركة Ankitects المملوكة المحدودة ومتطوعون"]
language = "ar"
src = "src"
title = "دليل استخدام أنكي"

[build]
create-missing = true

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[output.html]
git-repository-url = "https://github.com/abdnh/anki-manual"
additional-css = ["css/kbd.css", "css/rtl.css"]

[output.linkcheck]
optional = true
warning-policy = "warn"
follow-web-links = true
exclude = [
  'microsoft.com',
  'twitter.com',
  'stackexchange.com',
  'stackoverflow.com',
  'https://github.com/open-spaced-repetition/fsrs4anki#add-on-compatibility',
  'support.google.com',
  'wikiwiki.jp',
  'web.archive.org',
]

[output.html.fold]
enable = true
level = 0

[output.html.print]
enable = false

[output.html.redirect]
"/getting-help.html" = "https://docs.ankiweb.net/ar/manual/getting-help"
"/troubleshooting.html" = "https://docs.ankiweb.net/ar/manual/troubleshooting"
"/when-problems-occur.html" = "https://docs.ankiweb.net/ar/manual/troubleshooting"
"/faqs/when-problems-occur.html" = "https://docs.ankiweb.net/ar/manual/troubleshooting"
"/faqs/ankiapp-is-not-part-of-the-anki-ecosystem.html" = "https://docs.ankiweb.net/ar/faqs/anki-knockoffs"
"/importing/intro.html" = "https://docs.ankiweb.net/ar/manual/importing/intro"
